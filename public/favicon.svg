<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background card -->
  <rect width="64" height="64" rx="14" fill="#fff7e8"/>
  <!-- Warm border glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#ff2fb3" stroke-width="1.5" opacity="0.25"/>
  <!-- Hand emoji rendered as text for universal display -->
  <text x="32" y="42" font-size="30" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🫰</text>
  <!-- Neon pink heart badge top-right -->
  <circle cx="52" cy="12" r="10" fill="#ff2fb3"/>
  <text x="52" y="16.5" font-size="12" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="900">♥</text>
</svg>